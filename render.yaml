services:
  - type: web
    name: global-pay-backend
    env: node
    buildCommand: npm run install:backend
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FOREX_API_URL
        value: https://open.er-api.com/v6/latest
      - key: MONGO_URI
        sync: false
